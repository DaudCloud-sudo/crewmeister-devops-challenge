name: Crewmeister CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate-configuration:
    name: Validate deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate shell scripts and monitoring configuration
        run: |
          bash -n scripts/start-devops-lab.sh scripts/verify-devops-lab.sh scripts/provision-mysql-exporter-account.sh
          python scripts/validate-monitoring-config.py

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render application chart
        run: |
          helm lint helm/crewmeister
          helm template crewmeister helm/crewmeister --namespace default >/dev/null

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dev
          MYSQL_DATABASE: challenge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode verify

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: crewmeister-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
