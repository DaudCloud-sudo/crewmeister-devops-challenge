app:
  replicaCount: 1
  image:
    repository: localhost/crewmeister-app
    tag: "0.2"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  database:
    host: mysql
    port: 3306
    name: challenge
    username: root
    existingSecret: mysql-auth
    secretKey: root-password
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mysql:
  image:
    repository: docker.io/library/mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  database: challenge
  port: 3306
  service:
    port: 3306
  persistence:
    size: 2Gi
    accessMode: ReadWriteOnce
  existingSecret: mysql-auth
  secretKey: root-password
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
